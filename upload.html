<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedVision | Upload Image</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="upload-page">

    <!-- Navbar -->
    <nav class="upload-navbar">
        <a href="index.html" class="upload-brand">
            Med<span>Vision</span>
        </a>

        <a href="index.html" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Back
        </a>
    </nav>


    <!-- Upload Section -->
    <main class="upload-container">

        <div class="upload-heading">
            <p>MEDICAL IMAGE PROCESSING</p>

            <h1>Upload Your Image</h1>

            <span>
                Upload an MRI or CT image to begin the analysis.
            </span>
        </div>


        <!-- Upload Box -->
        <div class="upload-box">

            <div class="upload-icon">
                <i class="bi bi-cloud-arrow-up"></i>
            </div>

            <h2>Upload Medical Image</h2>

            <p>
                Drag & drop your image here or choose a file
            </p>

            <label for="imageInput" class="choose-btn">
                <i class="bi bi-folder2-open"></i>
                Choose Image
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg, image/jpg"
                hidden
            >

            <small>
                Supported formats: JPG, JPEG, PNG
            </small>

        </div>


        <!-- Image Preview -->
        <div class="preview-container" id="previewContainer">

            <h3>Selected Image</h3>

            <div class="preview-card">

                <img id="imagePreview" src="" alt="Selected medical image">

                <div class="preview-info">
                    <p id="fileName"></p>

                    <button id="processBtn" class="process-btn">
                        Process Image
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

            </div>

        </div>

    </main>


    <script src="js/upload.js"></script>

</body>
</html>
